[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqml-hierarchical-gctr"
version = "3.2.0"
description = "Baseline-audited hierarchical subspace recovery of depth-one QAOA landscapes"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.8,<4"]
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Molena Huynh"}]
keywords = ["QAOA", "hierarchical matrices", "butterfly", "compression"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
hierarchical-qaoa-reproduce = "hqml_hierarchical_gctr.experiment:main"
hierarchical-qaoa-design = "hqml_hierarchical_gctr.design_study:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hqml_hierarchical_gctr*"]

[tool.setuptools.package-data]
"hqml_hierarchical_gctr" = ["locked/*"]
